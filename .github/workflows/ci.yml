name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install 64tass
        run: sudo apt-get update && sudo apt-get install -y 64tass

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm run test
